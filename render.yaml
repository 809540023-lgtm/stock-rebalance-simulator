# Render blueprint for the static stock research site.
# Connect this repository to Render and it will provision a static site.
services:
  - type: web
    name: stock-rebalance-simulator
    runtime: static
    buildCommand: |
      mkdir -p _site
      cp index.html _site/
      cp -r market-risk-scanner _site/
      cp -r paper-trade-tracker _site/
      cp -r data _site/
      rm -rf _site/market-risk-scanner/scripts
    staticPublishPath: ./_site
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
