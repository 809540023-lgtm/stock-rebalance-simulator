<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>買入實測追蹤器</title>
  <style>
    :root{--bg:#f4f6f8;--surface:#fff;--ink:#182230;--muted:#667085;--line:#d5dbe5;--blue:#175cd3;--green:#087443;--green-soft:#e8f7ef;--red:#b42318;--red-soft:#fff0ef;--amber:#a15c00;--amber-soft:#fff6e5}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;line-height:1.5}.app{width:min(1120px,calc(100% - 28px));margin:auto;padding:24px 0 42px}header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}h1{margin:0;font-size:clamp(28px,4vw,42px);letter-spacing:0;line-height:1.15}.subtitle{margin:8px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-weight:700;text-decoration:none;cursor:pointer}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}.status{margin:0 0 16px;padding:11px 13px;border-left:4px solid var(--blue);border-radius:6px;background:#eef4ff;color:#344054}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.metric{min-height:96px;padding:15px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.metric strong{display:block;margin-bottom:7px;color:var(--muted);font-size:13px}.metric span{font-size:24px;font-weight:800}.metric.positive{background:var(--green-soft);border-color:#b9e5ca}.metric.negative{background:var(--red-soft);border-color:#ffd0cc}.positions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.position{padding:18px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.position-head{display:flex;align-items:start;justify-content:space-between;gap:16px}.position h2{margin:0;font-size:22px;letter-spacing:0}.code{color:var(--muted);font-size:14px}.badge{padding:4px 8px;border-radius:6px;background:var(--amber-soft);color:var(--amber);font-size:12px;font-weight:800;white-space:nowrap}.numbers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0}.datum{padding:10px 0;border-bottom:1px solid var(--line)}.datum strong{display:block;color:var(--muted);font-size:12px}.datum span{display:block;margin-top:3px;font-size:18px;font-weight:800}.gain{color:var(--green)}.loss{color:var(--red)}.progress-label{display:flex;justify-content:space-between;gap:12px;margin-bottom:7px;color:var(--muted);font-size:13px}.progress{height:12px;overflow:hidden;border-radius:4px;background:#e7ebf1}.progress span{display:block;height:100%;background:var(--green);transition:width .2s}.note{margin:14px 0 0;color:var(--muted);font-size:13px}.panel{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.panel h2{margin:0 0 10px;font-size:19px}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:14px}.day{position:relative;padding-top:22px;text-align:center;color:var(--muted);font-size:13px}.day:before{content:"";position:absolute;left:calc(50% - 6px);top:0;width:12px;height:12px;border-radius:50%;background:var(--blue)}.day:not(:last-child):after{content:"";position:absolute;left:50%;right:-50%;top:5px;height:2px;background:#b7c8e8}.footer{margin-top:18px;color:var(--muted);font-size:13px}@media(max-width:820px){header{align-items:start;flex-direction:column}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.positions{grid-template-columns:1fr}}@media(max-width:520px){.app{width:min(100% - 20px,1120px);padding-top:15px}.summary{grid-template-columns:1fr}.actions,.btn{width:100%}.timeline{grid-template-columns:1fr}.day{text-align:left;padding:0 0 16px 24px}.day:before{left:0;top:4px}.day:not(:last-child):after{left:5px;top:14px;bottom:0;width:2px;height:auto;right:auto}.numbers{grid-template-columns:1fr}}@media print{body{background:#fff}.actions{display:none}.app{width:100%;padding:0}.position,.panel,.metric{break-inside:avoid}}
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div><h1>買入實測追蹤器</h1><p class="subtitle">記錄實際成交價，追蹤三個交易日投報率與 5% LINE 通知。</p></div>
      <div class="actions"><a class="btn" href="../">回模擬器</a><button class="btn" id="printBtn" type="button">列印紀錄</button><button class="btn primary" id="refreshBtn" type="button">重新讀取</button></div>
    </header>
    <p class="status" id="status" aria-live="polite">正在讀取買入紀錄與官方行情。</p>
    <section class="summary" aria-label="投資組合摘要">
      <div class="metric"><strong>買入總成本</strong><span id="totalCost">—</span></div>
      <div class="metric"><strong>最新參考市值</strong><span id="marketValue">—</span></div>
      <div class="metric" id="profitMetric"><strong>帳面損益</strong><span id="profit">—</span></div>
      <div class="metric"><strong>帳面投報率</strong><span id="portfolioReturn">—</span></div>
      <div class="metric" id="netProfitMetric"><strong>現在賣出預估淨損益</strong><span id="netProfit">—</span></div>
      <div class="metric"><strong>預估淨投報率</strong><span id="netReturn">—</span></div>
    </section>
    <section class="positions" id="positions" aria-label="買入股票"></section>
    <section class="panel">
      <h2>三個交易日觀察</h2>
      <p class="note" id="evaluationText">—</p>
      <div class="timeline"><div class="day">8/12<br>成交紀錄</div><div class="day">8/13<br>第 1 日</div><div class="day">8/14<br>第 2 日</div><div class="day">8/17<br>第 3 日評估</div></div>
    </section>
    <p class="footer">預估淨損益採買賣各收 0.1425% 手續費（每筆最低 NT$20）及賣出 0.3% 證交稅試算，實際費用依券商折扣與帳單為準；未計入股利。盤中 5% 通知由雲端每 5 分鐘檢查一次，不構成買賣建議。</p>
  </main>
  <script>
    const money = (value) => Number.isFinite(value) ? "NT$" + Math.round(value).toLocaleString("zh-TW") : "—";
    const price = (value) => Number.isFinite(value) ? Number(value).toLocaleString("zh-TW", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "—";
    const percent = (value) => Number.isFinite(value) ? (value >= 0 ? "+" : "") + value.toFixed(2) + "%" : "—";
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
    async function load() {
      const status = document.getElementById("status");
      try {
        const [positionResponse, trackerResponse, marketResponse] = await Promise.all([fetch("../data/paper-trade-positions.json", { cache: "no-cache" }), fetch("../data/paper-trade-latest.json", { cache: "no-cache" }), fetch("../data/twse-latest.json", { cache: "no-cache" })]);
        if (!positionResponse.ok) throw new Error("買入紀錄讀取失敗");
        const portfolio = await positionResponse.json();
        const trackerMarket = trackerResponse.ok ? await trackerResponse.json() : { stocks: {}, marketDate: "" };
        const fallbackMarket = marketResponse.ok ? await marketResponse.json() : { stocks: {}, marketDate: "" };
        const market = trackerMarket.marketDate >= fallbackMarket.marketDate ? trackerMarket : fallbackMarket;
        const costs = portfolio.costAssumptions || { commissionRatePct: 0.1425, minimumCommission: 20, stockTransactionTaxPct: 0.3 };
        const commission = (amount) => Math.max(costs.minimumCommission, Math.round(amount * costs.commissionRatePct / 100));
        const transactionTax = (amount) => Math.floor(amount * costs.stockTransactionTaxPct / 100);
        let totalCost = 0, totalCashCost = 0, marketValue = 0, estimatedNetProceeds = 0, completePrices = true;
        document.getElementById("positions").innerHTML = portfolio.positions.map((position) => {
          const quote = market.stocks?.[position.code];
          const current = quote && quote.date >= position.buyDate ? Number(quote.close) : null;
          const cost = position.buyPrice * position.quantity;
          const buyFee = commission(cost);
          const value = Number.isFinite(current) ? current * position.quantity : null;
          const gainPct = Number.isFinite(current) ? (current / position.buyPrice - 1) * 100 : null;
          const gainAmount = Number.isFinite(value) ? value - cost : null;
          const sellFee = Number.isFinite(value) ? commission(value) : null;
          const sellTax = Number.isFinite(value) ? transactionTax(value) : null;
          const netPositionProfit = Number.isFinite(value) ? value - sellFee - sellTax - cost - buyFee : null;
          const targetProgress = Number.isFinite(current) ? Math.max(0, Math.min(100, ((current / position.buyPrice - 1) / (portfolio.alertGainPct / 100)) * 100)) : 0;
          totalCost += cost;
          totalCashCost += cost + buyFee;
          if (Number.isFinite(value)) { marketValue += value; estimatedNetProceeds += value - sellFee - sellTax; } else completePrices = false;
          return `<article class="position"><div class="position-head"><div><h2>${escapeHtml(position.name)}</h2><span class="code">${escapeHtml(position.code)}｜上市｜${Number(position.quantity).toLocaleString("zh-TW")} 股</span></div><span class="badge">持有測試</span></div><div class="numbers"><div class="datum"><strong>成交價</strong><span>${price(position.buyPrice)}</span></div><div class="datum"><strong>5% 通知價</strong><span>${price(position.targetPrice)}</span></div><div class="datum"><strong>最新收盤</strong><span>${price(current)}</span></div><div class="datum"><strong>帳面投報率</strong><span class="${gainPct >= 0 ? "gain" : "loss"}">${percent(gainPct)}</span></div><div class="datum"><strong>股票買入金額</strong><span>${money(cost)}</span></div><div class="datum"><strong>帳面損益</strong><span class="${gainAmount >= 0 ? "gain" : "loss"}">${money(gainAmount)}</span></div><div class="datum"><strong>預估買入手續費</strong><span>${money(buyFee)}</span></div><div class="datum"><strong>現在賣出預估淨損益</strong><span class="${netPositionProfit >= 0 ? "gain" : "loss"}">${money(netPositionProfit)}</span></div></div><div class="progress-label"><span>距離 5% 目標</span><strong>${Number.isFinite(gainPct) ? percent(gainPct) + " / +5.00%" : "等待行情"}</strong></div><div class="progress"><span style="width:${targetProgress}%"></span></div><p class="note">買入日 ${position.buyDate}｜三交易日評估 ${portfolio.evaluationTradingDate}</p></article>`;
        }).join("");
        const profit = completePrices ? marketValue - totalCost : null;
        const portfolioReturn = completePrices ? profit / totalCost * 100 : null;
        const netProfit = completePrices ? estimatedNetProceeds - totalCashCost : null;
        const netReturn = completePrices ? netProfit / totalCashCost * 100 : null;
        document.getElementById("totalCost").textContent = money(totalCost);
        document.getElementById("marketValue").textContent = completePrices ? money(marketValue) : "等待收盤";
        document.getElementById("profit").textContent = money(profit);
        document.getElementById("portfolioReturn").textContent = percent(portfolioReturn);
        document.getElementById("profitMetric").className = "metric " + (profit >= 0 ? "positive" : "negative");
        document.getElementById("netProfit").textContent = money(netProfit);
        document.getElementById("netReturn").textContent = percent(netReturn);
        document.getElementById("netProfitMetric").className = "metric " + (netProfit >= 0 ? "positive" : "negative");
        document.getElementById("evaluationText").textContent = `成交紀錄日 ${portfolio.recordedAt}；第三個交易日為 ${portfolio.evaluationTradingDate}。當天將依官方行情計算兩檔與整體投報率。`;
        status.textContent = completePrices ? `已載入證交所 ${market.marketDate} 收盤行情；專用收盤資料於交易日 13:40 更新，盤中通知每 5 分鐘檢查一次。` : `買入紀錄已保存；證交所收盤資料尚未更新到 ${portfolio.recordedAt}，目前等待當日收盤。`;
      } catch (error) { status.textContent = `資料讀取失敗：${error.message}`; }
    }
    document.getElementById("refreshBtn").addEventListener("click", load);
    document.getElementById("printBtn").addEventListener("click", () => window.print());
    load();
  </script>
</body>
</html>
