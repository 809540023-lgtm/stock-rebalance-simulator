name: Paper trade return LINE monitor

on:
  schedule:
    - cron: "*/5 1-5 * * 1-5"
  workflow_dispatch:
    inputs:
      force_run:
        description: "允許在非交易時段執行"
        required: false
        default: false
        type: boolean
      test_notification:
        description: "立即發送買入實測 LINE 測試"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: paper-trade-return-line-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check bought positions and notify LINE
        env:
          FORCE_RUN: ${{ inputs.force_run || 'false' }}
          LINE_TEST_MODE: ${{ inputs.test_notification || 'false' }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          REMINDER_TIMEZONE: Asia/Taipei
        run: node scripts/check-paper-trade-alerts.js

      - name: Commit notification state
        run: |
          if git diff --quiet -- data/paper-trade-alert-state.json; then
            echo "No new paper trade event state to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paper-trade-alert-state.json
          git commit -m "Record paper trade LINE alert"
          git push
