name: LINE investment reminder

on:
  schedule:
    # GitHub cron uses UTC. 01:00 UTC is 09:00 in Asia/Taipei.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: line-investment-reminder
  cancel-in-progress: false

jobs:
  send-line-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run reminder script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          INVESTMENT_REMINDER_TEXT: ${{ secrets.INVESTMENT_REMINDER_TEXT }}
          INVESTMENT_REMINDER_URL: ${{ secrets.INVESTMENT_REMINDER_URL }}
          REMINDER_TIMEZONE: Asia/Taipei
        run: node scripts/send-line-reminder.js
