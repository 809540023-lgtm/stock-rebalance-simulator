name: LINE investment reminder

on:
  schedule:
    # 09:00 in Asia/Tokyo / Asia/Taipei.
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  send-line-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send LINE reminder
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run reminder script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          INVESTMENT_REMINDER_TEXT: ${{ secrets.INVESTMENT_REMINDER_TEXT }}
          INVESTMENT_REMINDER_URL: ${{ secrets.INVESTMENT_REMINDER_URL }}
          REMINDER_TIMEZONE: Asia/Tokyo
        run: node scripts/send-line-reminder.js
