name: Simulate pre-open candidates

on:
  schedule:
    # Best-effort 5-minute observations, Taipei 09:00-13:55 weekdays.
    # Missed windows remain unresolved, never synthesized as fills.
    - cron: "*/5 1-5 * * 1-5"
  workflow_dispatch:
    inputs:
      force_run:
        description: "立即執行一次候選模擬"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: strategy-v2-data-writer
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Simulate pre-open candidates
        env:
          REMINDER_TIMEZONE: Asia/Taipei
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: node scripts/simulate-preopen-candidates.js

      - name: Commit simulation snapshots
        run: |
          node scripts/strategy-v2-summary.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shared data/preopen-simulation-latest.json data/preopen-simulation-history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record versioned candidate observations"
          for attempt in 1 2 3; do
            git pull --rebase
            if git push; then exit 0; fi
            sleep 3
          done
          exit 1
