name: Pre-open Taiwan stock research report

on:
  schedule:
    # Prepare 06:10 Taipei; publish 07:00 Taipei, Monday-Friday.
    # UTC Sunday-Thursday is the preceding calendar day.
    - cron: "10 22 * * 0-4"
    - cron: "0 23 * * 0-4"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [prepare, publish]
        default: prepare

permissions:
  contents: write
  actions: write
concurrency:
  group: strategy-v2-data-writer
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
      LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify deterministic strategy and accounting
        run: node --test tests/*.test.js
      - name: Prepare and freeze candidates before cutoff
        if: github.event.schedule == '10 22 * * 0-4' || inputs.mode == 'prepare'
        run: node scripts/run-strategy-v2.js
      - name: Publish frozen report or explicit unavailable status
        if: github.event.schedule == '0 23 * * 0-4' || inputs.mode == 'publish'
        run: node scripts/run-strategy-v2.js --publish
      - name: Commit versioned research data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shared
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update V2 pre-open research data"
          for attempt in 1 2 3; do
            git pull --rebase
            if git push; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Publish updated static data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Send report status to LINE
        if: (github.event.schedule == '0 23 * * 0-4' || inputs.mode == 'publish') && env.LINE_USER_ID != '' && (env.LINE_CHANNEL_ACCESS_TOKEN != '' || (env.LINE_CHANNEL_ID != '' && env.LINE_CHANNEL_SECRET != ''))
        run: node market-risk-scanner/scripts/send-preopen-line.js
