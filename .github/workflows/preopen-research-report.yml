name: Pre-open Taiwan stock research report

on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Taipei. Runs Monday-Friday Taipei time.
    - cron: "0 0 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preopen-taiwan-stock-research-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    # LINE secrets live here (job-level) so the send step's `if` can reference
    # them via the env context. Referencing `secrets.*` directly inside a step
    # `if:` makes GitHub reject the whole workflow at validation, which also
    # disables its schedule — that is why the 08:00 push stopped firing.
    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
      LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Refresh scanner data
        run: |
          end_date="$(TZ=Asia/Taipei date +%F)"
          start_date="$(TZ=Asia/Taipei date -d '90 days ago' +%F)"
          cd market-risk-scanner
          node scripts/update-risk-data.js "$start_date" "$end_date"
          node scripts/save-shared-candidates.js
          node scripts/build-preopen-report.js

      - name: Commit pre-open report
        run: |
          if git diff --quiet -- market-risk-scanner/data/market-risk.json data/shared; then
            echo "Pre-open report data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-risk-scanner/data/market-risk.json data/shared
          git commit -m "Update pre-open Taiwan stock research report"
          git push

      - name: Send pre-open report to LINE
        # Fires only when a recipient is set AND either a long-lived access
        # token or channel id/secret exists. Values come from the job-level env
        # (never reference secrets.* directly in an if: — GitHub rejects it).
        # Auth path (choose ONE, both via repo Actions secrets):
        #   - Long-lived: LINE_CHANNEL_ACCESS_TOKEN + LINE_USER_ID
        #   - Derived at runtime: LINE_CHANNEL_ID + LINE_CHANNEL_SECRET + LINE_USER_ID
        if: ${{ env.LINE_USER_ID != '' && (env.LINE_CHANNEL_ACCESS_TOKEN != '' || (env.LINE_CHANNEL_ID != '' && env.LINE_CHANNEL_SECRET != '')) }}
        run: |
          cd market-risk-scanner
          node scripts/send-preopen-line.js
