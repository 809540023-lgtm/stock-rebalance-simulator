name: Update standalone Taiwan stock risk scanner

on:
  schedule:
    - cron: "30 8 * * 1-5"
  workflow_dispatch:
    inputs:
      start_date:
        description: "分析開始日，留白代表最近 31 天"
        required: false
        type: string
      end_date:
        description: "分析結束日，留白代表今天"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: update-standalone-market-risk-scanner
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch official historical data
        env:
          INPUT_START_DATE: ${{ inputs.start_date }}
          INPUT_END_DATE: ${{ inputs.end_date }}
        run: |
          end_date="$INPUT_END_DATE"
          start_date="$INPUT_START_DATE"
          if [ -z "$end_date" ]; then end_date="$(date -u +%F)"; fi
          if [ -z "$start_date" ]; then start_date="$(date -u -d '31 days ago' +%F)"; fi
          cd market-risk-scanner
          node scripts/update-risk-data.js "$start_date" "$end_date"

      - name: Save shared candidate snapshots
        run: |
          cd market-risk-scanner
          node scripts/save-shared-candidates.js

      - name: Commit standalone scanner data
        run: |
          if git diff --quiet -- market-risk-scanner/data/market-risk.json data/shared; then
            echo "Risk scanner data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-risk-scanner/data/market-risk.json data/shared
          git commit -m "Update standalone Taiwan stock risk data"
          git push
