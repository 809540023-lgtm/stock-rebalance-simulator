name: Test stock simulator

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: stock-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        timeout-minutes: 5
        # Hosted runners already include Chromium runtime libraries. Avoid an
        # unrelated apt update blocking tests when Ubuntu mirrors are offline.
        run: npx playwright install chromium

      - name: Run browser tests
        run: npm test
